<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小胡同学pro</title>

<style>
/* ===== iOS基础 ===== */
body {
  margin:0;
  font-family:-apple-system, BlinkMacSystemFont, "Segoe UI";
  background:#0b1220;
  color:white;
  overflow:hidden;
}

/* ===== 启动页 ===== */
#boot {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1e293b,#0b1220);
}

#bootText {
  max-width:600px;
  text-align:center;
  font-size:16px;
  min-height:50px;
  opacity:0.9;
}

#enterBtn {
  margin-top:20px;
  padding:12px 18px;
  border:none;
  border-radius:14px;
  background:#007aff;
  color:white;
  opacity:0;
}

/* ===== Chat ===== */
#chat {
  display:none;
  height:100vh;
  flex-direction:column;
}

/* iOS滚动 */
#box {
  flex:1;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:20px;
  padding-bottom:140px;
}

/* 气泡 */
.msg {
  max-width:78%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:18px;
  font-size:15px;
  line-height:1.4;
  white-space:pre-wrap;
  backdrop-filter: blur(10px);
}

.user {
  background:#007aff;
  margin-left:auto;
}

.ai {
  background:rgba(255,255,255,0.08);
  margin-right:auto;
}

/* 输入栏 iOS风 */
#inputBar {
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  padding:10px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  display:flex;
  background:rgba(20,25,40,0.8);
  backdrop-filter: blur(20px);
}

input {
  flex:1;
  padding:12px;
  border:none;
  border-radius:14px;
  outline:none;
  font-size:16px;
  background:rgba(255,255,255,0.08);
  color:white;
}

button {
  margin-left:10px;
  padding:12px 16px;
  border:none;
  border-radius:14px;
  background:#007aff;
  color:white;
}

/* 动画 */
.fade {
  animation:fade .2s ease;
}
@keyframes fade {
  from {opacity:0; transform:translateY(6px);}
  to {opacity:1;}
}
</style>
</head>

<body>

<!-- ===== Boot ===== -->
<div id="boot">
  <h2>🤷🏻‍♂️ 小胡同学pro</h2>
  <div id="bootText"></div>
  <button id="enterBtn" onclick="start()">Enter</button>
</div>

<!-- ===== Chat ===== -->
<div id="chat">
  <div id="box"></div>

  <div id="inputBar">
    <input id="input" placeholder="Message..." />
    <button onclick="send()">↑</button>
  </div>
</div>

<script>

/* ===== 配置 ===== */
const API_URL = "https://new-api-production-ef85.up.railway.app/v1/chat/completions";

const MODELS = [
  "gpt-4o-mini",
  "deepseek-chat",
  "meta-llama-llama-3.1-8b-instruct"
];

let messages = [];

/* ===== Boot动画 ===== */
const bootText = "Loading AI model... connecting server... ready ✔";
let i=0;
const bootEl=document.getElementById("bootText");
const btn=document.getElementById("enterBtn");

function boot(){
  if(i<bootText.length){
    bootEl.innerHTML+=bootText[i++];
    requestAnimationFrame(()=>setTimeout(boot,40));
  } else {
    btn.style.opacity=1;
  }
}
boot();

function start(){
  document.getElementById("boot").style.display="none";
  document.getElementById("chat").style.display="flex";
}

/* ===== UI ===== */
function add(role,text){
  const div=document.createElement("div");
  div.className="msg "+role+" fade";
  div.innerText=text;
  const box=document.getElementById("box");
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
  return div;
}

/* iOS级丝滑打字 */
function type(el,text){
  let i=0;
  el.innerHTML="";
  function run(){
    if(i<text.length){
      el.innerHTML+=text[i++];
      requestAnimationFrame(()=>setTimeout(run,12));
    }
  }
  run();
}

/* ===== 发送 ===== */
async function send(){

  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  input.value="";

  add("user",text);
  messages.push({role:"user",content:text});

  const box=add("ai","...");

  const reply=await askAI();

  messages.push({role:"assistant",content:reply});

  type(box,reply);
}

/* ===== AI多模型 ===== */
async function askAI(){

  for(let m of MODELS){
    try{
      const res=await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:m,
          messages
        })
      });

      const data=await res.json();
      const c=data.choices?.[0]?.message?.content;
      if(c) return c;

    }catch(e){}
  }

  return "（小胡睡着了）我仍然可以简单回应你🙂";
}

</script>

</body>
</html>
