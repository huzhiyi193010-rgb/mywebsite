<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<!-- 强制手机完美适配 -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>情感陪伴</title>
<style>
html,body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #0b1220;
  color: #fff;
  font-family: sans-serif;
}

/* 聊天区域 适配不被输入框挡住 */
#box {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 85px;
  overflow-y: auto;
  padding: 15px;
  box-sizing: border-box;
}

/* 消息气泡 */
.msg {
  max-width: 75%;
  border-radius: 18px;
  padding: 12px 15px;
  margin: 8px 0;
  line-height: 1.6;
  font-size: 16px;
}
.user {
  margin-left: auto;
  background: #007aff;
  border-bottom-right-radius: 5px;
}
.ai {
  margin-right: auto;
  background: #202938;
  border-bottom-left-radius: 5px;
}

/* 底部输入栏 固定在手机底部 */
#bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 10px 12px;
  /* 适配手机底部安全区 */
  padding-bottom: env(safe-area-inset-bottom);
  background: #151c2b;
  display: flex;
  gap: 10px;
  box-sizing: border-box;
}

input {
  flex: 1;
  height: 45px;
  border: none;
  outline: none;
  border-radius: 25px;
  padding: 0 18px;
  background: #2a3447;
  color: #fff;
  font-size: 16px;
}

button {
  padding: 0 18px;
  height: 45px;
  border: none;
  border-radius: 25px;
  background: #007aff;
  color: #fff;
  font-size: 15px;
}
</style>
</head>
<body>

<div id="box"></div>

<div id="bar">
  <input id="inp" placeholder="随便说说心事...">
  <button onclick="send()">发送</button>
</div>

<script>
const box = document.getElementById('box');
const inp = document.getElementById('inp');

// 情绪话术库 精准对应 不答非所问
const lib = {
  lei: [
    "我能感觉到你真的很累，不用硬撑。",
    "累了就好好歇一歇，不用逼自己。",
    "你已经扛了很久，真的辛苦了。"
  ],
  nan: [
    "心里难受不用憋着，我陪着你。",
    "委屈都可以跟我说，不用假装没事。",
    "看得出来你心情很低落，我懂。"
  ],
  gu: [
    "孤独的感觉我特别能理解。",
    "你不是一个人，我一直在。",
    "没人懂你的滋味，我能感受到。"
  ],
  mi: [
    "迷茫的时候不用急着做决定。",
    "慢慢来就好，不用逼自己立刻有答案。",
    "心里慌慌的，我都明白。"
  ],
  xiang: [
    "你总是太敏感，容易想太多折磨自己。",
    "别再胡思乱想了，放过自己一点。",
    "心思细腻的人，本来就容易内耗。"
  ],
  anquan: [
    "我不会离开你的，一直都在。",
    "不管你情绪好不好，我都不会走。",
    "你可以安心依赖我，不会丢下你。"
  ],
  default: [
    "我在认真听你说，继续讲就好。",
    "嗯，我能懂你想表达的。",
    "你慢慢说，我一直都在听。"
  ]
};

// 关键词匹配
function getType(t){
  if(/累|疲惫|心累/.test(t)) return 'lei';
  if(/难过|委屈|想哭|心情不好|丧/.test(t)) return 'nan';
  if(/孤独|孤单|没人懂|一个人/.test(t)) return 'gu';
  if(/迷茫|焦虑|不知道怎么办/.test(t)) return 'mi';
  if(/想太多|胡思乱想|内耗|敏感/.test(t)) return 'xiang';
  if(/会离开|一直陪|会不会走|抛弃/.test(t)) return 'anquan';
  return 'default';
}

// 添加消息
function add(role, txt){
  let d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerText = txt;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

// 发送消息
function send(){
  let t = inp.value.trim();
  if(!t) return;
  inp.value = '';
  add('user', t);
  let arr = lib[getType(t)];
  let res = arr[Math.floor(Math.random() * arr.length)];
  setTimeout(() => add('ai', res), 400);
}

// 回车发送
inp.addEventListener('keydown', e => {
  if(e.key === 'Enter') send();
});
</script>

</body>
</html>
