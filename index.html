<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤷🏻‍♂️ 小胡同学</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#0b1220;
  color:white;
  overflow:hidden;
}

/* ======================
   🚀 BOOT（果冻升级）
====================== */
#boot{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1e293b,#0b1220);
}

/* iOS级弹性 */
@keyframes bootJelly {
  0%   { transform: scale(0.35); opacity:0; }
  45%  { transform: scale(1.15); opacity:1; }
  65%  { transform: scale(0.95); }
  85%  { transform: scale(1.03); }
  100% { transform: scale(1); }
}

#bootTitle{
  font-size:26px;
  margin-bottom:10px;
  animation:bootJelly 0.85s cubic-bezier(.2,.9,.2,1);
}

#bootText{
  max-width:600px;
  text-align:center;
  font-size:14px;
  min-height:40px;
  opacity:0.9;
}

#enterBtn{
  margin-top:20px;
  padding:12px 18px;
  border:none;
  border-radius:14px;
  background:#007aff;
  color:white;
  opacity:0;
  transition:0.3s;
}

/* ======================
   💬 CHAT
====================== */
#box{
  display:none;
  height:100vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:20px;
  padding-bottom:140px;
}

/* 气泡（更柔） */
.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:18px;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-word;

  opacity:0;
  transform: translateY(6px);
  animation: msgIn 0.25s ease forwards;

  will-change: transform, opacity;
}

@keyframes msgIn{
  to{
    opacity:1;
    transform: translateY(0);
  }
}

/* 用户 */
.user{
  background:#007aff;
  margin-left:auto;
}

/* AI */
.ai{
  background:rgba(255,255,255,0.08);
  margin-right:auto;
}

/* 🫧 果冻增强 */
@keyframes jelly {
  0%   { transform: scale(0.55); opacity:0; }
  40%  { transform: scale(1.12); opacity:1; }
  60%  { transform: scale(0.97); }
  100% { transform: scale(1); }
}

.jelly{
  animation:jelly 0.42s cubic-bezier(0.22, 1, 0.36, 1);
}

/* ======================
   📱 输入栏
====================== */
#bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  padding:10px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:rgba(20,25,40,0.85);
  backdrop-filter: blur(20px);
  display:none;
}

input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:14px;
  outline:none;
  font-size:16px;
  background:rgba(255,255,255,0.08);
  color:white;
}

button{
  margin-left:10px;
  padding:12px 16px;
  border:none;
  border-radius:14px;
  background:#007aff;
  color:white;
}

/* ======================
   🔽 回到底部
====================== */
#toBottom{
  position:fixed;
  right:15px;
  bottom:90px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:rgba(0,122,255,0.9);
  display:flex;
  justify-content:center;
  align-items:center;
  color:white;
  font-size:18px;
  opacity:0;
  transform:scale(0.8);
  transition:0.2s;
}
</style>
</head>

<body>

<!-- 🚀 BOOT -->
<div id="boot">
  <div id="bootTitle">🤷🏻‍♂️ 小胡同学pro</div>
  <div id="bootText"></div>
  <button id="enterBtn" onclick="enter()">Enter System</button>
</div>

<!-- 💬 CHAT -->
<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="想问哥点啥..." />
  <button onclick="send()">发送</button>
</div>

<div id="toBottom" onclick="scrollToBottom()">↓</div>

<script>

/* ======================
   ⚙️ API
====================== */
const API_URL = "https://new-api-production-ef85.up.railway.app/v1/chat/completions";

const MODELS = [
  "gpt-4o-mini",
  "deepseek-chat",
  "meta-llama-llama-3.1-8b-instruct"
];

let messages = [];

/* ======================
   🚀 BOOT
====================== */
const bootText = "正在加载AI模型...请稍后...……加载完成 ✔";

let i = 0;
const bootEl = document.getElementById("bootText");
const btn = document.getElementById("enterBtn");

function boot(){

  if(i < bootText.length){

    const span=document.createElement("span");
    span.innerText=bootText[i];
    span.style.display="inline-block";
    span.style.animation="bootJelly 0.35s ease-out";

    bootEl.appendChild(span);
    i++;

    requestAnimationFrame(()=>setTimeout(boot,25));

  } else {
    btn.style.opacity=1;
  }
}
boot();

/* ======================
   👉 进入系统
====================== */
function enter(){
  document.getElementById("boot").style.display="none";
  document.getElementById("box").style.display="block";
  document.getElementById("bar").style.display="flex";
}

/* ======================
   📱 滚动系统（最终丝滑版）
====================== */
let autoScroll = true;
const box = document.getElementById("box");
const btnBottom = document.getElementById("toBottom");

box.addEventListener("scroll", ()=>{

  const d = box.scrollHeight - box.scrollTop - box.clientHeight;

  autoScroll = d < 120;

  btnBottom.style.opacity = d > 150 ? 1 : 0;
  btnBottom.style.transform = d > 150 ? "scale(1)" : "scale(0.8)";
});

function smartScroll(){
  if(!autoScroll) return;

  requestAnimationFrame(()=>{
    box.scrollTo({top:box.scrollHeight,behavior:"auto"});
  });
}

function scrollToBottom(){
  autoScroll = true;
  requestAnimationFrame(()=>{
    box.scrollTo({top:box.scrollHeight,behavior:"smooth"});
  });
}

/* ======================
   💬 UI
====================== */
function add(role,text){

  const div=document.createElement("div");
  div.className="msg "+role+" jelly";
  div.innerText=text;

  box.appendChild(div);

  smartScroll();

  return div;
}

/* ======================
   ✨ 超丝滑逐字（核心升级）
====================== */
function type(el,text){

  if(!text){
    el.innerText="（无返回）";
    return;
  }

  el.innerHTML="";

  let i=0;
  let out="";
  let last=0;

  function step(t){

    if(t-last > 14){
      last=t;

      out += text[i];
      el.innerHTML = out;
      i++;

      smartScroll();
    }

    if(i < text.length){
      requestAnimationFrame(step);
    }
  }

  requestAnimationFrame(step);
}

/* ======================
   🚀 发送
====================== */
async function send(){

  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  input.value="";

  add("user",text);
  messages.push({role:"user",content:text});

  const boxMsg=add("ai","● ● ●");

  const reply=await askAI(text);

  messages.push({role:"assistant",content:reply});

  type(boxMsg,reply);
}

/* ======================
   🧠 AI
====================== */
async function askAI(text){

  for(let m of MODELS){

    try{
      const res=await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:m,
          messages
        })
      });

      const data=await res.json();

      const c=data?.choices?.[0]?.message?.content;

      if(c && c.trim()){
        return c;
      }

    }catch(e){}
  }

  return offline(text);
}

/* ======================
   🔴 离线兜底
====================== */
function offline(text){

  if(t.includes("你好")) return "胡智奕在睡觉我去叫他起床";
  if(t.includes("你是谁")) return "我是小胡同学，胡智奕创造了我";
  if(t.includes("怎么")) return "都跟你说了胡智奕在睡觉🙎🏻‍♂️";
  if(t.includes("什么")) return "你直接给胡智奕发微信不就完了嘛ㅅㅂ😅";
}

</script>

</body>
</html>
