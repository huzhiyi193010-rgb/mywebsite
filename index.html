<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤷🏻‍♂️小胡GPT Pro</title>

<style>
/* ======================
   🌌 科幻背景
====================== */
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  overflow:hidden;
  color:white;
  background: radial-gradient(circle at top,#0b1220,#05070f);
}

/* 动态光晕 */
body::before{
  content:"";
  position:fixed;
  inset:-50%;
  background: radial-gradient(circle,#00d4ff22,#0000 60%),
              radial-gradient(circle at 70% 30%,#7c3aed33,#0000 50%);
  animation: floatGlow 8s infinite linear;
  pointer-events:none;
}

@keyframes floatGlow{
  0%{transform:rotate(0deg);}
  100%{transform:rotate(360deg);}
}

/* ======================
   🚀 BOOT
====================== */
#boot{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  backdrop-filter: blur(20px);
}

#bootTitle{
  font-size:28px;
  letter-spacing:2px;
  background: linear-gradient(90deg,#00d4ff,#7c3aed,#00ffa3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: pulse 2s infinite;
}

@keyframes pulse{
  0%,100%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.08);opacity:0.8;}
}

#bootText{
  margin-top:10px;
  font-size:14px;
  opacity:0.8;
  text-align:center;
  max-width:600px;
}

#enterBtn{
  margin-top:20px;
  padding:12px 20px;
  border:none;
  border-radius:16px;
  background: linear-gradient(90deg,#00d4ff,#7c3aed);
  color:white;
  opacity:0;
  transition:0.3s;
  box-shadow:0 0 20px #00d4ff55;
}

/* ======================
   💬 CHAT
====================== */
#box{
  display:none;
  height:100vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:20px;
  padding-bottom:140px;
}

/* 气泡（玻璃感） */
.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:18px;
  line-height:1.4;
  backdrop-filter: blur(18px);
  border:1px solid rgba(255,255,255,0.08);
  animation: appear 0.25s ease;
}

@keyframes appear{
  from{transform:translateY(10px);opacity:0;}
  to{transform:translateY(0);opacity:1;}
}

.user{
  margin-left:auto;
  background: linear-gradient(135deg,#007aff,#00d4ff33);
}

.ai{
  margin-right:auto;
  background: rgba(255,255,255,0.06);
}

/* 🫧 果冻 */
.jelly{
  animation:jelly 0.4s cubic-bezier(.2,.9,.2,1);
}

@keyframes jelly{
  0%{transform:scale(0.5);}
  40%{transform:scale(1.12);}
  70%{transform:scale(0.97);}
  100%{transform:scale(1);}
}

/* ======================
   📱 输入栏
====================== */
#bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  padding:10px;
  backdrop-filter: blur(20px);
  background: rgba(10,15,25,0.6);
  display:none;
}

input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:14px;
  outline:none;
  font-size:16px;
  background:rgba(255,255,255,0.08);
  color:white;
}

button{
  margin-left:10px;
  padding:12px 16px;
  border:none;
  border-radius:14px;
  background: linear-gradient(135deg,#00d4ff,#7c3aed);
  color:white;
}

/* 回到底部 */
#toBottom{
  position:fixed;
  right:15px;
  bottom:90px;
  width:44px;
  height:44px;
  border-radius:50%;
  background:rgba(0,212,255,0.25);
  backdrop-filter: blur(10px);
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  transition:0.2s;
}
</style>
</head>

<body>

<!-- 🚀 BOOT -->
<div id="boot">
  <div id="bootTitle">🤷🏻‍♂️小胡GPT Pro</div>
  <div id="bootText"></div>
  <button id="enterBtn" onclick="enter()">进入大模型</button>
</div>

<!-- CHAT -->
<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="想问哥点啥..." />
  <button onclick="send()">发送</button>
</div>

<div id="toBottom" onclick="scrollToBottom()">↓</div>

<script>

/* ======================
   ⚙️ API
====================== */
const API_URL = "https://new-api-production-ef85.up.railway.app/v1/chat/completions";

const MODELS = [
  "gpt-4o-mini",
  "deepseek-chat",
  "meta-llama-llama-3.1-8b-instruct"
];

let messages = [];

/* ======================
   🚀 BOOT动画
====================== */
const bootText = "Initializing neural interface... syncing cloud... loading cognition layer... ready.";

let i=0;
const bootEl=document.getElementById("bootText");
const btn=document.getElementById("enterBtn");

function boot(){
  if(i<bootText.length){
    const s=document.createElement("span");
    s.innerText=bootText[i];
    s.style.animation="appear 0.2s ease";
    bootEl.appendChild(s);
    i++;
    requestAnimationFrame(()=>setTimeout(boot,20));
  }else{
    btn.style.opacity=1;
  }
}
boot();

/* ======================
   ENTER
====================== */
function enter(){
  document.getElementById("boot").style.display="none";
  document.getElementById("box").style.display="block";
  document.getElementById("bar").style.display="flex";
}

/* ======================
   SCROLL SYSTEM
====================== */
let autoScroll=true;
const box=document.getElementById("box");
const btnBottom=document.getElementById("toBottom");

box.addEventListener("scroll",()=>{
  const d=box.scrollHeight-box.scrollTop-box.clientHeight;
  autoScroll=d<120;
  btnBottom.style.opacity=d>150?1:0;
});

function smartScroll(){
  if(!autoScroll)return;
  requestAnimationFrame(()=>box.scrollTop=box.scrollHeight);
}

function scrollToBottom(){
  autoScroll=true;
  box.scrollTo({top:box.scrollHeight,behavior:"smooth"});
}

/* ======================
   UI
====================== */
function add(role,text){
  const div=document.createElement("div");
  div.className="msg "+role+" jelly";
  div.innerText=text;
  box.appendChild(div);
  smartScroll();
  return div;
}

/* ======================
   ✨ 逐字（科幻丝滑）
====================== */
function type(el,text){
  if(!text){el.innerText="...";return;}

  el.innerHTML="";
  let i=0,out="";

  function step(t){
    if(i<text.length){
      out+=text[i];
      el.innerHTML=out;
      i++;
      smartScroll();
    }
    requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

/* ======================
   SEND
====================== */
async function send(){
  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text)return;

  input.value="";

  add("user",text);
  messages.push({role:"user",content:text});

  const boxMsg=add("ai","...");

  const reply=await askAI(text);

  messages.push({role:"assistant",content:reply});

  type(boxMsg,reply);
}

/* ======================
   AI
====================== */
async function askAI(text){

  for(let m of MODELS){
    try{
      const r=await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:m,messages})
      });

      const d=await r.json();
      const c=d?.choices?.[0]?.message?.content;

      if(c)return c;

    }catch(e){}
  }

  return "SYSTEM OFFLINE • still able to process input.";
}

</script>

</body>
</html>
