<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤷🏻‍♂️小胡GPT Pro</title>

<style>
body{
  margin:0;
  font-family:-apple-system;
  background:#0b1220;
  color:white;
  overflow:hidden;
}

/* ======================
   🚀 BOOT（科幻开场）
====================== */
#boot{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top,#0b1220,#05070f);
  z-index:999;
  transition:0.5s;
}

#logo{
  font-size:26px;
  letter-spacing:2px;
  background: linear-gradient(90deg,#00d4ff,#7c3aed,#00ffa3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: glow 2s infinite;
}

@keyframes glow{
  0%,100%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.05);opacity:0.7;}
}

#bootText{
  margin-top:12px;
  font-size:13px;
  opacity:0.75;
  text-align:center;
  max-width:320px;
}

/* ======================
   💬 CHAT
====================== */
#box{
  height:100vh;
  overflow-y:auto;
  padding:20px;
  padding-bottom:140px;
  -webkit-overflow-scrolling:touch;
}

.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:16px;
  line-height:1.4;
  word-break:break-word;
  white-space:pre-wrap;
  backdrop-filter: blur(12px);

  opacity:0;
  transform: translateY(8px);
  animation: in 0.25s ease forwards;
}

@keyframes in{
  to{opacity:1;transform:translateY(0);}
}

.user{
  margin-left:auto;
  background:#007aff;
}

.ai{
  margin-right:auto;
  background:rgba(255,255,255,0.08);
}

/* ======================
   📱 输入栏
====================== */
#bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  padding:10px;
  background:rgba(20,25,40,0.8);
  backdrop-filter: blur(20px);
}

input{
  flex:1;
  padding:12px;
  border-radius:12px;
  border:none;
  outline:none;
  background:rgba(255,255,255,0.08);
  color:white;
}

button{
  margin-left:10px;
  padding:12px 16px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<!-- 🚀 BOOT -->
<div id="boot">
  <div id="logo">NEURAL AI 2.0</div>
  <div id="bootText"></div>
</div>

<!-- CHAT -->
<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="想问哥点啥..." />
  <button onclick="send()">发送</button>
</div>

<script>

/* ======================
   🧠 MEMORY
====================== */
let messages = JSON.parse(localStorage.getItem("mem") || "[]");

const box = document.getElementById("box");

/* ======================
   📱 iOS级滚动（修复版）
====================== */
let autoScroll = true;

function isBottom(){
  return box.scrollHeight - box.scrollTop - box.clientHeight < 100;
}

box.addEventListener("scroll",()=>{
  autoScroll = isBottom();
});

function scrollToBottom(force=false){
  if(!autoScroll && !force) return;

  requestAnimationFrame(()=>{
    box.scrollTop = box.scrollHeight;
  });
}

/* ======================
   💬 UI
====================== */
function add(role,text){

  const div=document.createElement("div");
  div.className="msg "+role;
  div.innerText=text;

  box.appendChild(div);

  scrollToBottom(true);

  return div;
}

/* ======================
   🧠 离线AI 2.0（带记忆）
====================== */
function offlineAI(input){

  const last = messages.slice(-8).map(m=>m.content).join(" ");

  if(input.includes("你好")) return "你好🙂 我是 NEURAL AI 2.0（离线模式），可以继续对话。";

  if(input.includes("你是谁")) return "我是运行在浏览器中的离线智能AI，具备基础记忆能力。";

  if(input.includes("怎么")){
    return "我可以帮你拆解步骤，你具体想解决什么问题？";
  }

  if(input.includes("为什么")){
    return "这个问题可以从原因和逻辑两方面分析，你想深入哪一部分？";
  }

  if(input.length < 3){
    return "可以说得更具体一点，我需要更多信息🙂";
  }

  if(last.includes("代码")){
    return "关于代码，我可以帮你优化结构或修复问题，你卡在哪一步？";
  }

  return `我理解你的意思是：「${input}」

我可以帮你继续扩展这个思路，你可以说得更具体一点。`;
}

/* ======================
   ✨ 逐字输出
====================== */
function type(el,text){

  el.innerHTML="";
  let i=0,out="";

  function step(){

    if(i<text.length){
      out+=text[i];
      el.innerText=out;
      i++;

      scrollToBottom();
    }

    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

/* ======================
   🚀 SEND
====================== */
function send(){

  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  input.value="";

  add("user",text);

  messages.push({role:"user",content:text});

  const aiBox=add("ai","...");

  const reply=offlineAI(text);

  messages.push({role:"assistant",content:reply});

  localStorage.setItem("mem",JSON.stringify(messages));

  type(aiBox,reply);
}

/* ======================
   🚀 BOOT动画（已整合）
====================== */
const bootLines=[
  "Initializing neural core...",
  "Loading memory system...",
  "Activating offline intelligence...",
  "Optimizing iOS interface...",
  "Ready."
];

const bootText=document.getElementById("bootText");

let i=0;

function boot(){

  if(i<bootLines.length){

    const div=document.createElement("div");
    div.innerText=bootLines[i];
    div.style.opacity=0;
    div.style.transition="0.4s";

    bootText.appendChild(div);

    setTimeout(()=>div.style.opacity=1,50);

    i++;
    setTimeout(boot,600);

  }else{

    setTimeout(()=>{
      document.getElementById("boot").style.opacity=0;

      setTimeout(()=>{
        document.getElementById("boot").style.display="none";
      },500);

    },800);
  }
}

boot();

</script>

</body>
</html>
