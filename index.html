<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤷🏻‍♂️小胡同学</title>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#0b1220;
  color:white;
}

#boot{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top,#0b1220,#05070f);
  z-index:999;
}

#logo{
  font-size:26px;
  background: linear-gradient(90deg,#00d4ff,#7c3aed,#00ffa3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: glow 2s infinite;
}

@keyframes glow{
  0%,100%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.05);opacity:0.7;}
}

#bootText{
  margin-top:12px;
  font-size:13px;
  opacity:0.75;
}

#box{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:70px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:16px;
  box-sizing:border-box;
}

.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:16px;
  line-height:1.4;
  white-space:pre-wrap;
}

.user{margin-left:auto;background:#007aff;}
.ai{margin-right:auto;background:rgba(255,255,255,0.08);}

#bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  display:flex;
  align-items:center;
  padding:10px;
  background:rgba(20,25,40,0.85);
  backdrop-filter: blur(20px);
}

input{
  flex:1;
  height:44px;
  font-size:16px;
  border:none;
  outline:none;
  border-radius:12px;
  padding:0 12px;
  background:rgba(255,255,255,0.08);
  color:white;
}

button{
  margin-left:10px;
  padding:10px 14px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
  <div id="logo">🤷🏻‍♂️小胡同学</div>
  <div id="bootText"></div>
</div>

<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="怎么啦..." />
  <button onclick="send()">发送</button>
</div>

<script>

/* ======================
   🧠 修复后的记忆系统
====================== */
let mem = JSON.parse(localStorage.getItem("mem") || "[]");
const box = document.getElementById("box");

/* ======================
   💬 安慰系统（保留你原来的核心）
====================== */
const COMFORT=[
"你已经很努力了，不需要逼自己。",
"慢一点也没关系，我在这里。",
"你不是一个人。",
"你可以先休息一下。",
"你已经做得很好了。",
"我会在这里。",
"情绪是真实的，不需要压抑。",
"你不用马上好起来。",
"我理解你。",
"我不会离开。"
];

/* ======================
   🧠 AI
====================== */
function ai(t){
  if(/难过|伤心|崩溃|压力|孤独/.test(t)){
    return COMFORT[Math.random()*COMFORT.length|0] + "\n\n我在这里。";
  }
  return "我在听你说：" + t;
}

/* ======================
   💬 UI
====================== */
function add(role,text){
  const d=document.createElement("div");
  d.className="msg "+role;
  d.innerText=text;
  box.appendChild(d);

  setTimeout(()=>{
    box.scrollTop = box.scrollHeight;
  },50);

  return d;
}

/* ======================
   🚀 SEND（已修复）
====================== */
function send(){

  const input=document.getElementById("input");
  const t=input.value.trim();
  if(!t) return;

  input.value="";

  add("user",t);

  mem.push({
    role:"user",
    content:t
  });

  const reply = ai(t);
  const aiBox = add("ai","...");

  type(aiBox,reply);

  mem.push({
    role:"ai",
    content:reply
  });

  localStorage.setItem("mem",JSON.stringify(mem));
}

/* ======================
   ✨ 打字效果（稳定版）
====================== */
function type(el,text){
  el.innerText="";
  let i=0;

  function step(){
    if(i<text.length){
      el.innerText += text[i++];
      requestAnimationFrame(step);
    }
  }
  step();
}

/* ======================
   🔁 关键修复：聊天恢复
====================== */
function restore(){

  if(!mem.length) return;

  mem.forEach(m=>{
    add(m.role,m.content);
  });

}

restore();

/* ======================
   🚀 BOOT（防卡死）
====================== */
setTimeout(()=>{
  const b=document.getElementById("boot");
  if(b){
    b.style.display="none";
  }
},2000);

</script>

</body>
</html>
