<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<title>🤷🏻‍♂️小胡GPT Pro</title>
<style>
html,body {
  margin: 0;
  padding: 0;
  height: 100%;
  overflow: hidden;
  background: #0b1220;
  color: #fff;
  font-family: sans-serif;
}

/* 开屏动画 */
#splash {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #0b1220;
  display: flex;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  transition: opacity 0.8s ease;
}
#splash-text {
  font-size: 28px;
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 1.2s ease, transform 1.2s ease;
}
#splash.hide {
  opacity: 0;
  pointer-events: none;
}

/* 聊天区域 */
#box {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 85px;
  overflow-y: auto;
  padding: 15px;
  box-sizing: border-box;
}

/* 消息气泡 */
.msg {
  max-width: 75%;
  border-radius: 18px;
  padding: 12px 15px;
  margin: 8px 0;
  line-height: 1.6;
  font-size: 16px;
  white-space: pre-wrap;
  word-break: break-word;
}
.user {
  margin-left: auto;
  background: #007aff;
  border-bottom-right-radius: 5px;
}
.ai {
  margin-right: auto;
  background: #202938;
  border-bottom-left-radius: 5px;
}

/* 底部输入栏 */
#bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  padding: 10px 12px;
  padding-bottom: env(safe-area-inset-bottom);
  background: #151c2b;
  display: flex;
  gap: 10px;
  box-sizing: border-box;
}

input {
  flex: 1;
  height: 45px;
  border: none;
  outline: none;
  border-radius: 25px;
  padding: 0 18px;
  background: #2a3447;
  color: #fff;
  font-size: 16px;
}

button {
  padding: 0 18px;
  height: 45px;
  border: none;
  border-radius: 25px;
  background: #007aff;
  color: #fff;
  font-size: 15px;
}
</style>
</head>
<body>

<div id="splash">
  <div id="splash-text">🤷🏻‍♂️小胡同学</div>
</div>

<div id="box"></div>

<div id="bar">
  <input id="inp" placeholder="什么事都要跟我说哦...">
  <button onclick="send()">告诉我</button>
</div>

<script>
const box = document.getElementById('box');
const inp = document.getElementById('inp');

// 开机问候语库 随机不重复
const helloList = [
  "你好我是小胡同学哦",
  "小胡同学在这里哦",
  "小胡同学一直在哦",
  "小胡同学没有睡着哦"
];

// 记录已用回复 永不重复
let usedLines = JSON.parse(localStorage.getItem("usedLines") || "[]");

// 心情等级关键词
const keyWords = {
  level1: ["累","烦","无聊","没劲","心情不好","丧"],
  level2: ["孤独","委屈","焦虑","压力","迷茫","内耗","想太多","孤单","自卑","压抑"],
  level3: ["崩溃","绝望","撑不住","想死","不想活","抑郁","无助","熬不下去"]
};

// 等级文案：等级越高句子越长
const lib = {
  level1: [
    "看得出来你心情有点闷闷的，不用勉强自己硬撑。",
    "偶尔情绪低落很正常，允许自己放松一下就好，我会一直在这里等你",
    "不想勉强自己开心的话，安静歇一会也没关系，看看窗外"
  ],
  level2: [
    "我能感受到你心里的不安和委屈，敏感的人总是容易想太多，把所有情绪都藏在心里，真的辛苦你了。",
    "孤独和迷茫缠在心里很难受，没有什么完美答案，我会慢慢陪着你听你倾诉，我们也可以是彼此的答案呀",
    "心思太重容易内耗，总习惯性为难自己，试着放过自己一点，你的感受本来就很值得被在意，听见了嘛"
  ],
  level3: [
    "我知道你现在已经快要撑不住了，心里积攒了太多委屈和疲惫，不用假装坚强，也不用逼着自己一定要好起来，你可以脆弱，可以停下来，我会一直安安静静陪着你。",
    "走到现在你已经咬牙坚持很久了，就算是感觉绝望、熬不下去也没关系，不用跟别人解释情绪，不用假装很开心，在我这里你可以做自己。"
  ],
  normal: [
    "我我会好好听你慢慢讲，你可以慢慢把心里想法都说出来...好不好..",
    "嗯.....我明白你想表达的感受，你继续说，我好好听听。",
    "原来是这样，能理解你此刻的心情，有什么都可以尽管跟我说，我有时候有点傻，即使我听不懂，说出来就好啦"
  ]
};

// 判断心情等级
function getMoodLevel(text){
  let s = text.toLowerCase();
  if(keyWords.level3.some(w=>s.includes(w))) return "level3";
  if(keyWords.level2.some(w=>s.includes(w))) return "level2";
  if(keyWords.level1.some(w=>s.includes(w))) return "level1";
  return "normal";
}

// 不重复取回复
function getUniqueReply(arr){
  let rest = arr.filter(item => !usedLines.includes(item));
  if(rest.length === 0){
    usedLines = [];
    localStorage.setItem("usedLines", JSON.stringify(usedLines));
    rest = arr;
  }
  let pick = rest[Math.floor(Math.random() * rest.length)];
  usedLines.push(pick);
  localStorage.setItem("usedLines", JSON.stringify(usedLines));
  return pick;
}

// 打字机
function typeWrite(el, text){
  el.innerText = "";
  let i = 0;
  function step(){
    if(i < text.length){
      el.innerText += text[i++];
      box.scrollTop = box.scrollHeight;
      setTimeout(step,15);
    }
  }
  step();
}

// 添加消息
function add(role, txt){
  let d = document.createElement('div');
  d.className = 'msg ' + role;
  d.innerText = txt;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

// 发送消息
function send(){
  let t = inp.value.trim();
  if(!t) return;
  inp.value = '';
  add('user', t);
  let level = getMoodLevel(t);
  let arr = lib[level];
  let res = getUniqueReply(arr);
  let aiDom = add('ai', '...');
  setTimeout(() => typeWrite(aiDom, res), 300);
}

// 页面首次加载 随机问候语
function showHello(){
  let ran = helloList[Math.floor(Math.random() * helloList.length)];
  add("ai", ran);
}

// 回车发送
inp.addEventListener('keydown', e => {
  if(e.key === 'Enter') send();
});

// 开屏动画 + 首次问候
window.onload = function(){
  // 先问候
  setTimeout(showHello, 500);
  // 开屏动画
  const splash = document.getElementById('splash');
  const splashText = document.getElementById('splash-text');
  setTimeout(()=>{
    splashText.style.opacity = "1";
    splashText.style.transform = "translateY(0)";
  }, 200);
  setTimeout(()=>{
    splash.classList.add('hide');
  }, 2200);
}
</script>

</body>
</html>
