<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤷🏻‍♂️小胡同学 v15 FINAL</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#0b1220;
  color:white;
}

#box{
  position:fixed;
  top:0;left:0;right:0;bottom:70px;
  overflow-y:auto;
  padding:16px;
  box-sizing:border-box;
  -webkit-overflow-scrolling:touch;
}

.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-word;
}

.user{margin-left:auto;background:#007aff;}
.ai{margin-right:auto;background:rgba(255,255,255,0.08);}

#bar{
  position:fixed;
  bottom:0;left:0;right:0;
  height:70px;
  display:flex;
  align-items:center;
  padding:10px;
  background:rgba(20,25,40,0.85);
  backdrop-filter: blur(20px);
}

input{
  flex:1;
  height:44px;
  border:none;
  border-radius:12px;
  padding:0 12px;
  font-size:16px;
  background:rgba(255,255,255,0.08);
  color:white;
  outline:none;
}

button{
  margin-left:10px;
  padding:10px 14px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="说点什么..." />
  <button onclick="send()">发送</button>
</div>

<script>

/* ======================
   🧠 记忆
====================== */
let messages = JSON.parse(localStorage.getItem("mem") || "[]");
const box = document.getElementById("box");

/* ======================
   🧠 AI状态系统
====================== */
let AI = {
  warmth: 0.6,
  tired: 0.2,
  attachment: 0.3
};

let emotionScore = 0.5;

/* ======================
   🧠 情绪识别
====================== */
function isSad(text){
  return ["难过","伤心","孤独","崩溃","累","烦","痛苦"].some(w=>text.includes(w));
}

/* ======================
   🧠 情绪成长
====================== */
function evolve(text){
  if(isSad(text)) emotionScore += 0.05;
  if(text.includes("谢谢")) emotionScore += 0.02;

  emotionScore = Math.max(0,Math.min(1,emotionScore));

  AI.warmth = Math.min(1, AI.warmth + emotionScore * 0.01);
  if(text.includes("算了")) AI.tired += 0.03;
}

/* ======================
   💬 安慰系统（稳定版）
====================== */
function comfort(){

  const light = [
    "你已经很累了，可以先休息一下。",
    "慢一点没关系。",
    "你已经做得很好了。",
    "不用逼自己现在好起来。",
    "我在这里。"
  ];

  const mid = [
    "我能感觉你现在不太好。",
    "你不是一个人。",
    "可以不用马上振作。",
    "慢慢说没关系。",
    "我在听。"
  ];

  const deep = [
    "我在这里，不会走。",
    "你已经撑很久了。",
    "你可以停下来。",
    "不用解释，我在。",
    "我不会催你。"
  ];

  let pool =
    emotionScore > 0.7 ? deep :
    emotionScore > 0.4 ? mid : light;

  return pool[Math.floor(Math.random()*pool.length)] +
`\n\n我会一直在这里听你说。`;
}

/* ======================
   🧠 思考式AI回复（稳定版）
====================== */
function reply(text){

  evolve(text);

  let think = [
    "……让我想一下。",
    "我刚刚停了一下。",
    "我在整理怎么说。"
  ];

  let base = think[Math.floor(Math.random()*think.length)];

  let voice =
    AI.warmth > 0.7 ? "我会在这里。" :
    AI.tired > 0.6 ? "你可以慢一点说。" :
    "我在听你说。";

  if(isSad(text)){
    return base + "\n\n" + voice + "\n\n" + comfort();
  }

  return base + "\n\n" + voice + "\n\n我理解你的意思。";
}

/* ======================
   💬 UI
====================== */
function add(role,text){
  const div=document.createElement("div");
  div.className="msg "+role;
  div.innerText=text;
  box.appendChild(div);
  box.scrollTop=box.scrollHeight;
  return div;
}

/* ======================
   ✨ 安全打字（不会卡死）
====================== */
function type(el,text){

  el.innerText = "";

  let i = 0;
  const max = text.length;

  function step(){

    if(i >= max){
      return;
    }

    el.innerText += text[i];
    i++;

    box.scrollTop = box.scrollHeight;

    setTimeout(step, 12); // ⭐稳定关键点（替代 RAF死循环）
  }

  step();
}

/* ======================
   🚀 SEND
====================== */
function send(){

  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  input.value="";

  add("user",text);
  messages.push({role:"user",content:text});

  const ai = add("ai","...");

  const res = reply(text);

  type(ai,res);

  messages.push({role:"assistant",content:res});

  localStorage.setItem("mem",JSON.stringify(messages));
}

/* ======================
   🔄 恢复聊天
====================== */
function restore(){
  messages.forEach(m=>{
    add(m.role,m.content);
  });
}
restore();

</script>

</body>
</html>
