<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<title>AI Pro SaaS</title>

<style>
body {
  margin: 0;
  font-family: Arial;
  background: #0a0f1c;
  color: white;
  display: flex;
  height: 100vh;
}

/* 左侧历史 */
#sidebar {
  width: 260px;
  background: #111827;
  padding: 10px;
  overflow-y: auto;
}

.history-item {
  padding: 10px;
  margin: 5px 0;
  background: #1f2937;
  border-radius: 6px;
  cursor: pointer;
}

/* 主区域 */
#main {
  flex: 1;
  display: flex;
  flex-direction: column;
}

header {
  padding: 10px;
  background: #111827;
  display: flex;
  justify-content: space-between;
}

#chatBox {
  flex: 1;
  overflow-y: auto;
  padding: 15px;
}

.msg {
  max-width: 70%;
  padding: 10px;
  margin: 8px;
  border-radius: 10px;
  white-space: pre-wrap;
}

.user { background: #2563eb; margin-left: auto; }
.ai { background: #374151; }

.inputBar {
  display: flex;
  padding: 10px;
  background: #111827;
}

input {
  flex: 1;
  padding: 10px;
  border: none;
  border-radius: 8px;
}

button {
  margin-left: 10px;
  padding: 10px 14px;
  background: #22c55e;
  border: none;
  border-radius: 8px;
  color: white;
  cursor: pointer;
}
</style>
</head>

<body>

<div id="sidebar">
  <h3>💬 History</h3>
  <div class="history-item">新对话</div>
</div>

<div id="main">

<header>
  <span>🤖 AI Pro SaaS</span>
  <select id="modelSelect">
    <option value="openrouter/free">Free Model</option>
    <option value="meta-llama/llama-3.1-8b-instruct:free">Llama 3</option>
  </select>
</header>

<div id="chatBox"></div>

<div class="inputBar">
  <input id="userInput" placeholder="输入问题..." />
  <button onclick="sendMessage()">发送</button>
</div>

</div>

<script>

const API_URL = "https://new-api-production-ef85.up.railway.app/v1/chat/completions";

// 🧠 多轮记忆
let messages = [];

async function sendMessage(){

  const input = document.getElementById("userInput");
  const text = input.value.trim();
  if(!text) return;

  const model = document.getElementById("modelSelect").value;

  addMsg("user", text);
  input.value = "";

  messages.push({ role: "user", content: text });

  const aiBox = addMsg("ai", "thinking...");

  try {

    const res = await fetch(API_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: model,
        messages: messages
      })
    });

    const data = await res.json();

    const reply = data.choices?.[0]?.message?.content || "error";

    messages.push({ role: "assistant", content: reply });

    typeWriter(aiBox, reply);

  } catch (e) {
    aiBox.innerText = "错误：" + e.message;
  }
}

function addMsg(role, text){
  const div = document.createElement("div");
  div.className = "msg " + role;
  div.innerText = text;

  document.getElementById("chatBox").appendChild(div);
  return div;
}

function typeWriter(el, text){
  let i = 0;
  el.innerText = "";

  const t = setInterval(() => {
    el.innerText += text[i];
    i++;
    if(i >= text.length) clearInterval(t);
  }, 15);
}

</script>

</body>
</html>
