<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤷🏻‍♂️小胡同学 v15 FIX MOBILE</title>

<style>

/* ======================
   📱 手机适配修复核心
====================== */
html,body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#0b1220;
  color:white;
}

/* ⭐ 关键修复：安全高度 */
body{
  padding-top: env(safe-area-inset-top);
  padding-bottom: env(safe-area-inset-bottom);
}

/* ======================
   💬 聊天区域修复
====================== */
#box{
  position:fixed;
  top:0;
  left:0;
  right:0;

  /* ⭐ 修复：避免被输入框挡住 */
  bottom: calc(70px + env(safe-area-inset-bottom));

  overflow-y:auto;
  -webkit-overflow-scrolling:touch;

  padding:16px;
  box-sizing:border-box;
}

/* ======================
   🧠 消息气泡
====================== */
.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.user{margin-left:auto;background:#007aff;}
.ai{margin-right:auto;background:rgba(255,255,255,0.08);}

/* ======================
   ⌨️ 输入栏修复（核心）
====================== */
#bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  height:70px;
  display:flex;
  align-items:center;

  padding:10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));

  background:rgba(20,25,40,0.85);
  backdrop-filter: blur(20px);

  box-sizing:border-box;
}

/* ⭐ 防止键盘挤压（安卓 + iOS） */
input{
  flex:1;
  height:44px;
  font-size:16px;
  border:none;
  outline:none;
  border-radius:12px;
  padding:0 12px;

  background:rgba(255,255,255,0.08);
  color:white;
}

button{
  margin-left:10px;
  padding:10px 14px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:white;
}

/* ======================
   📱 防键盘遮挡优化
====================== */
@supports (-webkit-touch-callout: none) {
  #bar{
    position: fixed;
  }
}

</style>
</head>

<body>

<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="说点什么..." />
  <button onclick="send()">发送</button>
</div>

<script>

/* ======================
   🧠 原系统（完全不改）
====================== */
let messages = JSON.parse(localStorage.getItem("mem") || "[]");
const box = document.getElementById("box");

let emotionScore = 0.5;

/* ===== 情绪识别 ===== */
function detectEmotion(text){
  if(["想死","绝望","崩溃","撑不住"].some(w=>text.includes(w))) return "deep";
  if(["孤独","焦虑","压力","空虚"].some(w=>text.includes(w))) return "mid";
  if(["累","烦","难过"].some(w=>text.includes(w))) return "light";
  return "none";
}

/* ===== 关系问题 ===== */
function isBondQuestion(text){
  return ["会一直在","会离开","会陪我","会走吗","会不会不见"].some(w=>text.includes(w));
}

/* ===== 成长 ===== */
function evolve(text){
  if(detectEmotion(text)!=="none") emotionScore+=0.05;
  emotionScore=Math.min(1,emotionScore);
}

/* ===== 安慰系统（原版保留） ===== */
function comfort(text){

  const level = detectEmotion(text);

  const LIGHT=[
    "你已经很累了，可以慢一点。",
    "不用逼自己现在变好。",
    "你已经做得很好了。"
  ];

  const MID=[
    "我能感觉你现在不太好。",
    "你不是一个人。",
    "慢慢说没关系。"
  ];

  const DEEP=[
    "我在这里，不会走。",
    "你可以停下来。",
    "不用解释，我在。"
  ];

  let pool =
    level==="deep"?DEEP:
    level==="mid"?MID:LIGHT;

  return pool[Math.floor(Math.random()*pool.length)];
}

/* ===== 关系回复 ===== */
function bondReply(){
  if(emotionScore>0.7) return "我不会轻易离开你。";
  if(emotionScore>0.4) return "我会在这里。";
  return "我在听你说。";
}

/* ===== AI核心 ===== */
function reply(text){

  evolve(text);

  let think=["……让我想一下。","我在整理你的话。"];
  let base=think[Math.floor(Math.random()*think.length)];

  if(isBondQuestion(text)){
    return base+"\n\n"+bondReply();
  }

  if(detectEmotion(text)!=="none"){
    return base+"\n\n"+comfort(text);
  }

  return base+"\n\n我理解你的意思。";
}

/* ======================
   💬 UI
====================== */
function add(role,text){
  const d=document.createElement("div");
  d.className="msg "+role;
  d.innerText=text;
  box.appendChild(d);

  /* ⭐ 修复滚动（手机关键） */
  setTimeout(()=>{
    box.scrollTop = box.scrollHeight;
  },10);

  return d;
}

/* ======================
   ✨ 打字（防卡死）
====================== */
function type(el,text){
  el.innerText="";
  let i=0;
  function step(){
    if(i<text.length){
      el.innerText+=text[i++];
      box.scrollTop=box.scrollHeight;
      setTimeout(step,12);
    }
  }
  step();
}

/* ======================
   🚀 SEND
====================== */
function send(){

  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  input.value="";

  add("user",text);

  const ai=add("ai","...");

  const res=reply(text);

  type(ai,res);

  messages.push({role:"user",content:text});
  messages.push({role:"assistant",content:res});

  localStorage.setItem("mem",JSON.stringify(messages));
}

/* ======================
   🔄 恢复
====================== */
messages.forEach(m=>add(m.role,m.content));

</script>

</body>
</html>
