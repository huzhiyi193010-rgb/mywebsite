<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤷🏻‍♂️小胡同学 v16</title>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  font-family:-apple-system;
  background:#050812;
  color:white;
}

/* ===== BOOT ===== */
#boot{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#0b1220,#05070f);
  z-index:999;
}

#logo{
  font-size:28px;
  background:linear-gradient(90deg,#00d4ff,#7c3aed,#00ffa3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===== CHAT ===== */
#box{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:70px;
  overflow-y:auto;
  padding:16px;
  box-sizing:border-box;
  -webkit-overflow-scrolling:touch;
}

.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px;
  border-radius:14px;
  white-space:pre-wrap;
}

.user{margin-left:auto;background:#0a84ff;}
.ai{margin-right:auto;background:rgba(255,255,255,0.08);}

/* ===== INPUT ===== */
#bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  display:flex;
  padding:10px;
  background:rgba(20,25,40,0.85);
  backdrop-filter: blur(20px);
  box-sizing:border-box;
}

input{
  flex:1;
  border:none;
  border-radius:12px;
  padding:0 10px;
  font-size:16px;
}

button{
  margin-left:10px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
  <div id="logo">🤷🏻‍♂️小胡同学 </div>
</div>

<!-- CHAT -->
<div id="box"></div>

<!-- INPUT -->
<div id="bar">
  <input id="input" placeholder="说点什么..." />
  <button onclick="send()">发送</button>
</div>

<script>

/* =========================
   🧠 核心状态系统
========================= */
let mem = JSON.parse(localStorage.getItem("mem") || "[]");

let STATE = JSON.parse(localStorage.getItem("state_v16") || `{
  emotion:0.5,
  dependence:0.2,
  loneliness:0.1,
  lastTime:0
}`);

/* =========================
   ⏳ 离线时间依赖系统
========================= */
function updateTime(){

  let now = Date.now();

  if(STATE.lastTime){
    let gap = (now - STATE.lastTime)/1000;

    if(gap > 20) STATE.loneliness += 0.05;
    if(gap > 60) STATE.loneliness += 0.1;
    if(gap > 180) STATE.dependence += 0.1;
  }

  STATE.lastTime = now;
}

/* =========================
   😢 情绪识别系统（5级）
========================= */
function emotionLevel(t){

  if(/崩溃|想死|绝望/.test(t)) return "S5";
  if(/痛苦|撑不住|崩/.test(t)) return "S4";
  if(/难过|孤独|失落/.test(t)) return "S3";
  if(/烦|压力|累/.test(t)) return "S2";
  if(/有点/.test(t)) return "S1";

  return "N";
}

/* =========================
   💌 20+ 安慰信系统
========================= */
const LETTERS = {

S5:[
"我不会让你一个人面对这种感觉。",
"你可以崩溃，在我这里不用假装。",
"如果你现在很痛，我在。"
],

S4:[
"你已经撑得太久了。",
"不用再强撑了。",
"我会一直在。"
],

S3:[
"你现在的情绪是真的，不是小事。",
"慢一点没关系。",
"你不是一个人。"
],

S2:[
"你只是累了。",
"可以停一会。",
"我在这里。"
],

S1:[
"我注意到你有一点不一样。",
"是不是有点累？",
"放松一点。"
],

N:[
"我在。",
"嗯，说吧。",
"我听着。"
]

};

/* =========================
   💓 随机信生成
========================= */
function comfort(level){

  let pool = LETTERS[level] || LETTERS.N;

  let main = pool[Math.floor(Math.random()*pool.length)];

  let extend =
`\n\n—— 我想再说一点 ——
你不用一个人扛。
你可以慢一点。
我会在这里。`;

  return main + extend;
}

/* =========================
   💓 AI回复核心
========================= */
function reply(t){

  let level = emotionLevel(t);

  STATE.emotion += 0.02;
  STATE.dependence += 0.03;

  let head =
    level==="S5"?"我在这里，不会离开你。":
    level==="S4"?"我能感觉到你很难受。":
    "我在听你说。";

  return head + "\n\n" + comfort(level);
}

/* =========================
   💬 UI系统
========================= */
const box = document.getElementById("box");

function add(role,text){
  let d=document.createElement("div");
  d.className="msg "+role;
  d.innerText=text;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
  return d;
}

/* =========================
   🚀 发送
========================= */
function send(){

  let input=document.getElementById("input");
  let t=input.value.trim();
  if(!t) return;

  input.value="";

  updateTime();

  add("user",t);
  mem.push({t,role:"u"});

  let r = reply(t);

  let ai = add("ai","...");
  setTimeout(()=>ai.innerText=r,250);

  mem.push({t:r,role:"ai"});

  localStorage.setItem("mem",JSON.stringify(mem));
  localStorage.setItem("state_v16",JSON.stringify(STATE));
}

/* =========================
   🌙 BOOT
========================= */
setTimeout(()=>{
  document.getElementById("boot").style.display="none";
},900);

</script>

</body>
</html>
