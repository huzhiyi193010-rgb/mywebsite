<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤷🏻‍♂️小胡同学 v15</title>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  font-family:-apple-system;
  background:#050812;
  color:white;
}

/* ===== BOOT ===== */
#boot{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#0b1220,#05070f);
  z-index:999;
}

#logo{
  font-size:28px;
  background:linear-gradient(90deg,#00d4ff,#7c3aed,#00ffa3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===== CHAT BOX（修复关键） ===== */
#box{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:70px; /* 保证输入框不遮挡 */
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:16px;
  box-sizing:border-box;
}

.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px;
  border-radius:14px;
  white-space:pre-wrap;
  word-break:break-word;
}

.user{margin-left:auto;background:#0a84ff;}
.ai{margin-right:auto;background:rgba(255,255,255,0.08);}

/* ===== INPUT BAR（修复关键） ===== */
#bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  display:flex;
  align-items:center;
  padding:10px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:rgba(20,25,40,0.85);
  backdrop-filter: blur(20px);
  box-sizing:border-box;
}

input{
  flex:1;
  height:44px;
  font-size:16px;
  border:none;
  outline:none;
  border-radius:12px;
  padding:0 12px;
  background:rgba(255,255,255,0.08);
  color:white;
}

button{
  margin-left:10px;
  padding:10px 14px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
  <div id="logo">🤷🏻‍♂️小胡同学 v15</div>
  <div id="bootText"></div>
</div>

<!-- CHAT -->
<div id="box"></div>

<!-- INPUT -->
<div id="bar">
  <input id="input" placeholder="小脑袋想什么呢..." />
  <button onclick="send()">告诉我</button>
</div>

<script>

/* ======================
   🧠 记忆系统（修复）
====================== */
let mem = JSON.parse(localStorage.getItem("mem") || "[]");

/* ======================
   💓 情绪 & 依赖
====================== */
let LIFE = JSON.parse(localStorage.getItem("life") || `{
  emotion:0.5,
  dependence:0.2
}`);

/* ======================
   😢 情绪识别
====================== */
function emo(t){
  if(/崩溃|绝望|想死|撑不住/.test(t)) return "deep";
  if(/难过|伤心|孤独|失落|痛苦/.test(t)) return "mid";
  if(/烦|累|压力/.test(t)) return "low";
  return "normal";
}

/* ======================
   💌 安慰系统（保留增强版）
====================== */
const COMFORT = {

deep:[
"我知道你现在不是简单难过，而是很重的情绪。",
"你可以不用撑，我在这里。",
"你不用解释，我都在。"
],

mid:[
"我能感觉到你现在不太好。",
"你不用一个人扛。",
"慢慢来没关系。"
],

low:[
"你只是累了。",
"可以停一下。",
"你已经做得很好了。"
],

normal:[
"我在。",
"继续说吧。",
"嗯，我听着。"
]

};

/* ======================
   💓 回复
====================== */
function reply(t){

  let level = emo(t);

  LIFE.emotion += 0.03;
  LIFE.dependence += 0.02;

  let head =
    level==="deep"?"我在这里，不会让你一个人。":
    level==="mid"?"我能感觉到你不太好。":
    "我在听你说。";

  let list = COMFORT[level] || COMFORT.normal;
  let body = list[Math.floor(Math.random()*list.length)];

  return head + "\n\n" + body;
}

/* ======================
   💬 UI
====================== */
const box=document.getElementById("box");

function add(role,text){
  let d=document.createElement("div");
  d.className="msg "+role;
  d.innerText=text;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return d;
}

/* ======================
   🚀 SEND
====================== */
function send(){

  let input=document.getElementById("input");
  let t=input.value.trim();
  if(!t) return;

  input.value="";

  add("user",t);
  mem.push({role:"u",t});

  let r = reply(t);

  let ai = add("ai","...");
  setTimeout(()=>ai.innerText=r,300);

  mem.push({role:"ai",t:r});

  localStorage.setItem("mem",JSON.stringify(mem));
}

</script>

</body>
</html>
