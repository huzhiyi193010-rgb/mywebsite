<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小胡同学pro</title>

<style>
body {
  margin:0;
  font-family:Arial;
  background:#0f172a;
  color:white;
  overflow:hidden;
}

/* ===== 启动页 ===== */
#boot {
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle at top,#1e293b,#0f172a);
}

#bootText {
  max-width:600px;
  text-align:center;
  font-size:18px;
  min-height:60px;
}

.cursor {
  display:inline-block;
  width:8px;
  background:white;
  animation:blink 0.8s infinite;
}

@keyframes blink {
  50% {opacity:0;}
}

#enterBtn {
  margin-top:20px;
  padding:12px 18px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
  opacity:0;
  transition:0.5s;
}

/* ===== 聊天页 ===== */
#chat {
  display:none;
  height:100vh;
  flex-direction:column;
}

#box {
  flex:1;
  overflow:auto;
  padding:20px;
  padding-bottom:100px;
}

.msg {
  max-width:75%;
  margin:10px 0;
  padding:12px 16px;
  border-radius:10px;
  white-space:pre-wrap;
}

.user {
  background:#2563eb;
  margin-left:auto;
}

.ai {
  background:rgba(255,255,255,0.08);
}

#inputBox {
  position:fixed;
  bottom:0;
  width:100%;
  display:flex;
  padding:10px;
  background:#111827;
}

input {
  flex:1;
  padding:12px;
  border:none;
  border-radius:8px;
}

button {
  margin-left:10px;
  padding:12px;
  border:none;
  border-radius:8px;
  background:#2563eb;
  color:white;
}

/* 动画 */
.fade {
  animation:fade .2s ease-in;
}
@keyframes fade {
  from{opacity:0;transform:translateY(5px);}
  to{opacity:1;}
}
</style>
</head>

<body>

<!-- ===== 启动页 ===== -->
<div id="boot">
  <h2>🤖 小胡同学pro</h2>
  <div id="bootText"></div>
  <span class="cursor"></span>
  <button id="enterBtn" onclick="startChat()">进入系统</button>
</div>

<!-- ===== 聊天页 ===== -->
<div id="chat">
  <div id="box"></div>

  <div id="inputBox">
    <input id="input" placeholder="输入你的问题..." />
    <button onclick="send()">发送</button>
  </div>
</div>

<script>

/* ===== 配置 ===== */
const API_URL = "https://new-api-production-ef85.up.railway.app/v1/chat/completions";

const MODELS = [
  "gpt-4o-mini",
  "deepseek-chat",
  "meta-llama-llama-3.1-8b-instruct"
];

let messages = [];

/* ===== 启动动画 ===== */
const bootText = "初始化AI系统...加载模型...连接服务器...完成 ✔";
let i = 0;
const bootEl = document.getElementById("bootText");
const btn = document.getElementById("enterBtn");

function typeBoot(){
  if(i < bootText.length){
    bootEl.innerHTML += bootText[i++];
    setTimeout(typeBoot,50);
  } else {
    btn.style.opacity = 1;
  }
}

setTimeout(typeBoot,800);

function startChat(){
  document.getElementById("boot").style.display="none";
  document.getElementById("chat").style.display="flex";
}

/* ===== UI ===== */
function add(role,text){
  const div=document.createElement("div");
  div.className="msg "+role+" fade";
  div.innerText=text;
  document.getElementById("box").appendChild(div);
  window.scrollTo(0,document.body.scrollHeight);
  return div;
}

/* ===== 打字机 ===== */
function type(el,text){
  let i=0;
  el.innerHTML="";
  function run(){
    if(i<text.length){
      el.innerHTML+=text[i++];
      setTimeout(run,15);
    }
  }
  run();
}

/* ===== 发送 ===== */
async function send(){

  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  input.value="";

  add("user",text);
  messages.push({role:"user",content:text});

  const box=add("ai","思考中...");

  const reply=await askAI(text);

  messages.push({role:"assistant",content:reply});

  type(box,reply);
}

/* ===== AI核心（自动降级） ===== */
async function askAI(text){

  for(let m of MODELS){
    try{
      const res=await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:m,
          messages:messages
        })
      });

      const data=await res.json();
      const c=data.choices?.[0]?.message?.content;
      if(c) return c;

    }catch(e){}
  }

  return offline(text);
}

/* ===== 离线模式 ===== */
function offline(text){

  if(text.includes("你好")) return "你好🙂（离线模式）";
  if(text.includes("你是谁")) return "我是离线AI助手";
  if(text.includes("怎么")) return "建议拆分步骤思考🙂";

  return "当前离线模式，但我仍然可以简单回应你🙂";
}

</script>

</body>
</html>
