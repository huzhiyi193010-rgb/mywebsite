<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>情感陪伴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{background:#0b1220;color:#fff;font-size:16px;}
#box{padding:15px;padding-bottom:80px;}
.msg{border-radius:15px;padding:12px;margin:10px 0;max-width:80%;line-height:1.6;}
.user{background:#007aff;margin-left:auto;}
.ai{background:#222;margin-right:auto;}
#bar{position:fixed;bottom:0;left:0;right:0;padding:10px;background:#111;display:flex;gap:8px;}
input{flex:1;padding:10px;border-radius:10px;border:0;outline:0;background:#333;color:#fff;}
button{padding:10px 15px;border-radius:10px;border:0;background:#007aff;color:#fff;}
</style>
</head>
<body>

<div id="box"></div>
<div id="bar">
  <input id="inp" placeholder="说点什么...">
  <button onclick="send()">发送</button>
</div>

<script>
const box = document.getElementById('box');
const inp = document.getElementById('inp');

// 情感语录库
const lib = {
  lei:["我懂你的疲惫，不用硬撑着。","累了就停下来歇会儿，没关系的。","你已经够辛苦了，别再为难自己。"],
  nan:["心里难受就不用忍着，我在听。","委屈都可以跟我说，不用假装坚强。","能感觉到你现在心情很低落。"],
  gu:["一个人心里空空的滋味真的不好受。","我陪着你，不会让你一直孤单。","懂你那种没人理解的孤独感。"],
  mi:["迷茫的时候不用急着找答案。","慢慢来，路会一点点清晰的。","不用慌，很多事都可以慢慢熬过去。"],
  xiang:["你总是想太多，把自己困住了。","别胡思乱想了，放过自己一点。","心思太敏感的人最容易内耗。"],
  anquan:["我不会离开你的，放心就好。","不管怎样我都会一直在。","你不用害怕被丢下，我一直在。"],
  default:["嗯，我在认真听你说。","我懂你的意思。","你继续说，我听着呢。"]
};

// 匹配情绪
function getType(t){
  if(/累|疲惫|心累/.test(t)) return 'lei';
  if(/难过|委屈|想哭|心情不好/.test(t)) return 'nan';
  if(/孤独|孤单|一个人|没人懂/.test(t)) return 'gu';
  if(/迷茫|焦虑|不知道怎么办/.test(t)) return 'mi';
  if(/想太多|胡思乱想|内耗/.test(t)) return 'xiang';
  if(/会离开|一直陪|会不会走/.test(t)) return 'anquan';
  return 'default';
}

// 添加消息
function add(role,txt){
  let d = document.createElement('div');
  d.className = 'msg '+role;
  d.innerText = txt;
  box.appendChild(d);
  box.scrollTop = box.scrollHeight;
}

// 发送
function send(){
  let t = inp.value.trim();
  if(!t)return;
  inp.value = '';
  add('user',t);
  // 随机不重复回复
  let arr = lib[getType(t)];
  let res = arr[Math.floor(Math.random()*arr.length)];
  setTimeout(()=>add('ai',res),300);
}

// 回车发送
inp.onkeydown = e=>e.key==='Enter'&&send();
</script>

</body>
</html>
