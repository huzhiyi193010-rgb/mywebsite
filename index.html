<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🤷🏻‍♂️小胡同学 v15 EMO+</title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#0b1220;
  color:white;
}

#box{
  position:fixed;
  top:0;left:0;right:0;bottom:70px;
  overflow-y:auto;
  padding:16px;
}

.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:14px;
  white-space:pre-wrap;
}

.user{margin-left:auto;background:#007aff;}
.ai{margin-right:auto;background:rgba(255,255,255,0.08);}

#bar{
  position:fixed;
  bottom:0;left:0;right:0;
  height:70px;
  display:flex;
  padding:10px;
  background:rgba(20,25,40,0.85);
}

input{
  flex:1;
  border:none;
  border-radius:10px;
  padding:10px;
  background:rgba(255,255,255,0.08);
  color:white;
}

button{
  margin-left:10px;
  border:none;
  border-radius:10px;
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="说点什么..." />
  <button onclick="send()">发送</button>
</div>

<script>

let messages = JSON.parse(localStorage.getItem("mem") || "[]");
const box = document.getElementById("box");

/* ======================
   🧠 情绪强度系统
====================== */
let emotionScore = 0.5;

/* ======================
   ❤️ 关系问题
====================== */
function isBondQuestion(text){
  return [
    "会一直在","会一直陪","会离开","会走吗",
    "会不会不见","会陪我吗","会在吗","会离开我吗"
  ].some(w=>text.includes(w));
}

/* ======================
   😔 情绪识别（扩展版）
====================== */
function detectEmotion(text){

  // 深层崩溃
  if([
    "想死","活不下去","崩溃","绝望","撑不住","毁灭","结束"
  ].some(w=>text.includes(w))) return "deep";

  // 强情绪
  if([
    "孤独","抑郁","痛苦","失眠","空虚","崩溃","压力大","焦虑"
  ].some(w=>text.includes(w))) return "mid";

  // 轻情绪
  if([
    "难过","伤心","累","烦","不开心","郁闷","低落"
  ].some(w=>text.includes(w))) return "light";

  return "none";
}

/* ======================
   🧠 成长系统
====================== */
function evolve(text){
  if(detectEmotion(text)!=="none") emotionScore += 0.05;
  emotionScore = Math.min(1,emotionScore);
}

/* ======================
   ❤️ 关系回应
====================== */
function bondReply(){

  if(emotionScore > 0.75){
    return "我不会轻易离开你。只要你愿意说，我就在。";
  }

  if(emotionScore > 0.4){
    return "我会在，但也希望你能慢慢好起来。";
  }

  return "我在这里听你说。";
}

/* ======================
   💔 超强安慰系统（扩展20+语义）
====================== */
function comfort(text){

  const level = detectEmotion(text);

  const LIGHT = [
    "你只是有点累了，不需要逼自己。",
    "慢一点没关系，你已经很努力了。",
    "可以停下来休息一下。",
    "你已经做得很好了。",
    "情绪会过去的。"
  ];

  const MID = [
    "我能感觉你现在不太好。",
    "你不用一个人扛着。",
    "慢慢说，我在听。",
    "你可以不用马上变好。",
    "我会在这里。"
  ];

  const DEEP = [
    "我在这里，不会走。",
    "你已经撑很久了。",
    "你可以先停下来。",
    "不用解释，我在。",
    "你不需要一个人面对这些。"
  ];

  let pool =
    level==="deep"?DEEP:
    level==="mid"?MID:LIGHT;

  let base = pool[Math.floor(Math.random()*pool.length)];

  // 二次扩展情绪（关键增强）
  let extra = "";

  if(text.includes("空虚")) extra = "\n有时候空不是问题，是你太久没被理解。";
  if(text.includes("焦虑")) extra = "\n你不是太敏感，你只是太在意。";
  if(text.includes("自责")) extra = "\n你不用把所有问题都归到自己身上。";
  if(text.includes("孤独")) extra = "\n有人在听你说话，这一点很重要。";

  return base + extra + "\n\n我一直在这里。";
}

/* ======================
   🧠 AI核心
====================== */
function reply(text){

  evolve(text);

  let thinking = [
    "……让我慢慢想一下。",
    "我在整理你的话。",
    "我停了一下。"
  ];

  let base = thinking[Math.floor(Math.random()*thinking.length)];

  if(isBondQuestion(text)){
    return base + "\n\n" + bondReply();
  }

  let emo = detectEmotion(text);
  if(emo!=="none"){
    return base + "\n\n" + comfort(text);
  }

  return base + "\n\n我理解你的意思。";
}

/* ======================
   💬 UI
====================== */
function add(role,text){
  const d=document.createElement("div");
  d.className="msg "+role;
  d.innerText=text;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return d;
}

/* ======================
   ✨ 打字（稳定）
====================== */
function type(el,text){
  el.innerText="";
  let i=0;
  function step(){
    if(i<text.length){
      el.innerText+=text[i++];
      box.scrollTop=box.scrollHeight;
      setTimeout(step,12);
    }
  }
  step();
}

/* ======================
   🚀 SEND
====================== */
function send(){

  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  input.value="";

  add("user",text);
  messages.push({role:"user",content:text});

  const ai=add("ai","...");

  const res=reply(text);

  type(ai,res);

  messages.push({role:"assistant",content:res});

  localStorage.setItem("mem",JSON.stringify(messages));
}

/* ======================
   🔄 恢复
====================== */
function restore(){
  messages.forEach(m=>add(m.role,m.content));
}
restore();

</script>

</body>
</html>
