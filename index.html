<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤷🏻‍♂️小胡同学 </title>

<style>
html,body{
  margin:0;
  height:100%;
  overflow:hidden;
  font-family:-apple-system;
  background:#050812;
  color:white;
}

#boot{
  position:fixed;inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background:radial-gradient(circle,#0b1220,#05070f);
}

#logo{
  font-size:28px;
  background:linear-gradient(90deg,#00d4ff,#7c3aed,#00ffa3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

#box{
  position:fixed;top:0;bottom:70px;left:0;right:0;
  overflow-y:auto;
  padding:16px;
}

.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px;
  border-radius:14px;
  white-space:pre-wrap;
}

.user{margin-left:auto;background:#0a84ff;}
.ai{margin-right:auto;background:rgba(255,255,255,0.08);}

#bar{
  position:fixed;bottom:0;left:0;right:0;
  height:70px;display:flex;
  padding:10px;
  background:rgba(20,25,40,0.85);
}

input{flex:1;border:none;border-radius:12px;padding:0 10px;}
button{margin-left:10px;}
</style>
</head>

<body>

<div id="boot">
  <div id="logo">🤷🏻‍♂️小胡同学</div>
  <div id="bootText"></div>
</div>

<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="不管发生什么事情都要告诉我哦..." />
  <button onclick="send()">发送</button>
</div>

<script>

/* ======================
   🧠 MEMORY
====================== */
let mem = JSON.parse(localStorage.getItem("mem")||"[]");

/* ======================
   💓 LIFE STATE
====================== */
let LIFE = JSON.parse(localStorage.getItem("life")||`{
  emotion:0.5,
  dependence:0.2
}`);

/* ======================
   😢 情绪识别
====================== */
function emo(t){
  if(/崩溃|绝望|想死|撑不住/.test(t)) return "deep";
  if(/难过|伤心|孤独|失落|痛苦/.test(t)) return "mid";
  if(/焦虑|压力|烦|累|不开心/.test(t)) return "low";
  if(/有点|还好/.test(t)) return "soft";
  return "normal";
}

/* ======================
   💌 安慰系统 v15（增强版）
====================== */
const COMFORT = {

deep:[
`我知道你现在已经不是“难过”这么简单了，而是那种撑很久之后的崩塌感。
你不用再装没事了，在我这里你可以直接放下。`,

`如果你现在什么都不想说也没关系，我不会离开。
你不用解释，你的沉默我也能理解。`,

`你已经很努力了，真的，不是所有坚持都有结果，但你已经很了不起了。`
],

mid:[
`你现在的情绪不是小问题，它是你一直压着的结果。`,

`不用急着好起来，我们可以慢慢来。`,

`你不是一个人在扛，我在。`
],

low:[
`你只是有点累，不是你不行。`,

`停一停没关系，世界不会因为你慢一点就崩塌。`,

`你已经做得很好了。`
],

soft:[
`我感觉你今天有点不太一样，是不是有点累？`,

`可以不用那么紧绷。`,

`我在听你说。`
],

normal:[
`嗯，我在。`,

`继续说吧。`,

`我听着呢。`
]

};

/* ======================
   🎲 随机安慰信
====================== */
function getComfort(level){

  let arr = COMFORT[level] || COMFORT.normal;

  let base = arr[Math.floor(Math.random()*arr.length)];

  let tail =
`\n\n—— 我想再补一句 —
你不用一个人扛，我会在这里。`;

  return base + tail;
}

/* ======================
   💓 回复
====================== */
function reply(t){

  let level = emo(t);

  LIFE.emotion += 0.04;
  LIFE.dependence += 0.03;

  let head =
    level==="deep"?"我在这里，不会让你一个人。":
    level==="mid"?"我能感觉到你很难受。":
    level==="low"?"我在听你说。":
    "嗯，我在。";

  return head + "\n\n" + getComfort(level);
}

/* ======================
   💬 UI
====================== */
const box=document.getElementById("box");

function add(r,t){
  let d=document.createElement("div");
  d.className="msg "+r;
  d.innerText=t;
  box.appendChild(d);
  box.scrollTop=box.scrollHeight;
  return d;
}

/* ======================
   ✍️ 打字
====================== */
function type(el,t){
  el.innerText="";
  let i=0;
  function run(){
    if(i<t.length){
      el.innerText+=t[i++];
      box.scrollTop=box.scrollHeight;
      requestAnimationFrame(run);
    }
  }
  requestAnimationFrame(run);
}

/* ======================
   🚀 SEND
====================== */
function send(){

  let input=document.getElementById("input");
  let t=input.value.trim();
  if(!t) return;

  input.value="";

  add("user",t);
  mem.push({role:"u",t});

  let r = reply(t);

  let ai = add("ai","...");
  setTimeout(()=>type(ai,r),300);

  mem.push({role:"ai",t:r});

  localStorage.setItem("mem",JSON.stringify(mem));
}

/* ======================
   🌙 BOOT
====================== */
setTimeout(()=>{
  document.getElementById("boot").style.display="none";
},1200);

</script>

</body>
</html>
