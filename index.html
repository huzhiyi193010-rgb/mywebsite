<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>🤷🏻‍♂️小胡同学</title>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  width:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#0b1220;
  color:white;
  -webkit-text-size-adjust:100%;
}

/* ===== BOOT ===== */
#boot{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top,#0b1220,#05070f);
  z-index:999;
  transition:0.5s;
}

#logo{
  font-size:22px;
  text-align:center;
  background: linear-gradient(90deg,#00d4ff,#7c3aed,#00ffa3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

/* ===== CHAT CORE FIX ===== */
#box{
  position:fixed;
  top:0;
  left:0;
  right:0;

  /* ⭐关键：适配 iPhone 安全区 + 键盘 */
  bottom: calc(70px + env(safe-area-inset-bottom));

  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:12px;
  box-sizing:border-box;
}

/* ===== MESSAGE ===== */
.msg{
  max-width:85%;
  margin:8px 0;
  padding:10px 12px;
  border-radius:14px;
  line-height:1.4;
  word-break:break-word;
  white-space:pre-wrap;
  font-size:15px;
}

.user{
  margin-left:auto;
  background:#007aff;
}

.ai{
  margin-right:auto;
  background:rgba(255,255,255,0.08);
  backdrop-filter: blur(10px);
}

/* ===== INPUT BAR FIX ===== */
#bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;

  height:auto;
  min-height:70px;

  display:flex;
  align-items:center;
  gap:10px;

  padding:10px;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));

  background:rgba(20,25,40,0.85);
  backdrop-filter: blur(20px);

  box-sizing:border-box;
}

input{
  flex:1;
  height:44px;
  font-size:16px;
  border:none;
  outline:none;
  border-radius:12px;
  padding:0 12px;
  background:rgba(255,255,255,0.08);
  color:white;
}

button{
  padding:10px 14px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:white;
  font-size:14px;
}

/* 防止 iOS 输入放大 */
input,button{
  -webkit-tap-highlight-color:transparent;
}
</style>
</head>

<body>

<!-- BOOT -->
<div id="boot">
  <div id="logo">🤷🏻‍♂️小胡同学</div>
  <div id="bootText"></div>
</div>

<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="不开心要告诉我哦..." />
  <button onclick="send()">发送</button>
</div>

<script>

/* ======================
   🧠 防卡死兜底（必须保留）
====================== */
setTimeout(()=>{
  const b=document.getElementById("boot");
  if(b) b.style.display="none";
}, 3500);

/* ======================
   🧠 记忆
====================== */
let mem = JSON.parse(localStorage.getItem("mem")||"[]");
let profile = JSON.parse(localStorage.getItem("profile")||"{emo:0.5,dep:0.2,trust:0.5}");

const box = document.getElementById("box");

/* ======================
   😢 情绪检测
====================== */
function emoLevel(t){
  if(/崩溃|绝望|想死|撑不住/.test(t)) return 3;
  if(/难过|孤独|压力|伤心/.test(t)) return 2;
  if(/累|烦/.test(t)) return 1;
  return 0;
}

/* ======================
   💌 安慰系统（不变核心）
====================== */
const COMFORT=[
"你已经很努力了，不需要再逼自己。",
"慢一点也没关系，我在。",
"你现在的感受是真实的。",
"你不用一个人扛。",
"我不会离开。",
"可以先停一下。",
"你已经很好了。",
"我理解你。",
"不是你弱，是你累了。",
"我会在这里听你。"
];

/* ======================
   🧠 AI
====================== */
function ai(t){
  if(emoLevel(t)>0){
    return COMFORT[Math.random()*COMFORT.length|0] + "\n\n我在。";
  }
  return "我在听你说：" + t;
}

/* ======================
   💬 UI
====================== */
function add(role,text){
  const d=document.createElement("div");
  d.className="msg "+role;
  d.innerText=text;
  box.appendChild(d);

  // ⭐关键：移动端自动滚动修复
  setTimeout(()=>{
    box.scrollTop = box.scrollHeight;
  },50);

  return d;
}

/* ======================
   🚀 SEND
====================== */
function send(){
  const input=document.getElementById("input");
  const t=input.value.trim();
  if(!t) return;

  input.value="";

  add("user",t);
  mem.push({t});

  const r=ai(t);
  const aiBox=add("ai","...");

  type(aiBox,r);

  mem.push({r});
  localStorage.setItem("mem",JSON.stringify(mem));
}

/* ======================
   ✨ 打字（移动端优化版）
====================== */
function type(el,text){
  el.innerText="";
  let i=0;

  function step(){
    if(i<text.length){
      el.innerText+=text[i++];
      if(i%2===0){
        box.scrollTop = box.scrollHeight;
      }
      requestAnimationFrame(step);
    }
  }
  step();
}

/* ======================
   🚀 BOOT（稳定版）
====================== */
let bootText=document.getElementById("bootText");
let lines=["启动中...","加载情绪模型...","完成"];

let i=0;
function boot(){
  if(i<lines.length){
    let d=document.createElement("div");
    d.innerText=lines[i++];
    bootText.appendChild(d);
    setTimeout(boot,500);
  }else{
    document.getElementById("boot").style.opacity="0";
    setTimeout(()=>document.getElementById("boot").remove(),400);
  }
}
boot();

</script>

</body>
</html>
