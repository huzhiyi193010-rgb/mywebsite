<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小胡同学pro</title>

<style>
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#0b1220;
  color:white;
  overflow:hidden;
}

/* ===== 聊天容器 ===== */
#box{
  height:100vh;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:20px;
  padding-bottom:140px;
}

/* ===== 气泡 ===== */
.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:18px;
  line-height:1.4;
  white-space:pre-wrap;
  word-break:break-word;
  backdrop-filter: blur(10px);
  transform-origin: bottom;
}

/* 用户 */
.user{
  background:#007aff;
  margin-left:auto;
}

/* AI */
.ai{
  background:rgba(255,255,255,0.08);
  margin-right:auto;
}

/* ===== 🫧 高级果冻动画（优化版） ===== */
@keyframes jelly {
  0% { transform: scale(0.6); opacity:0; }
  40% { transform: scale(1.12); opacity:1; }
  60% { transform: scale(0.96); }
  80% { transform: scale(1.02); }
  100% { transform: scale(1); }
}

.jelly{
  animation:jelly 0.38s cubic-bezier(.2,.9,.2,1);
}

/* ===== 输入栏 ===== */
#bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  display:flex;
  padding:10px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:rgba(20,25,40,0.85);
  backdrop-filter: blur(20px);
}

input{
  flex:1;
  padding:12px;
  border:none;
  border-radius:14px;
  outline:none;
  font-size:16px;
  background:rgba(255,255,255,0.08);
  color:white;
}

button{
  margin-left:10px;
  padding:12px 16px;
  border:none;
  border-radius:14px;
  background:#007aff;
  color:white;
}
</style>
</head>

<body>

<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="想问哥点啥..." />
  <button onclick="send()">发送</button>
</div>

<script>

/* ======================
   ⚙️ API配置
====================== */
const API_URL = "https://new-api-production-ef85.up.railway.app/v1/chat/completions";

const MODELS = [
  "gpt-4o-mini",
  "deepseek-chat",
  "meta-llama-llama-3.1-8b-instruct"
];

let messages = [];

/* ======================
   💬 UI（优化滚动）
====================== */
function add(role,text){

  const div=document.createElement("div");
  div.className="msg "+role+" jelly";
  div.innerText=text;

  const box=document.getElementById("box");
  box.appendChild(div);

  requestAnimationFrame(()=>{
    box.scrollTop = box.scrollHeight;
  });

  return div;
}

/* ======================
   ✨ 更自然逐字
====================== */
function type(el,text){

  if(!text || text.length === 0){
    el.innerText = "（无返回内容）";
    return;
  }

  el.innerHTML = "";

  let i = 0;
  let out = "";

  function run(){
    if(i < text.length){
      out += text[i];
      el.innerHTML = out;
      i++;

      const speed = Math.random()*12 + 6;
      setTimeout(run, speed);
    }
  }

  run();
}

/* ======================
   🚀 发送
====================== */
async function send(){

  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  input.value="";

  add("user",text);
  messages.push({role:"user",content:text});

  const box=add("ai","● ● ●");

  const reply=await askAI(text);

  messages.push({role:"assistant",content:reply});

  type(box,reply);
}

/* ======================
   🧠 AI核心（强化稳定版）
====================== */
async function askAI(text){

  for(let m of MODELS){

    try{

      const res=await fetch(API_URL,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:m,
          messages
        })
      });

      const data=await res.json();

      const c=data?.choices?.[0]?.message?.content;

      if(c && typeof c === "string" && c.trim().length>0){
        return c;
      }

    }catch(e){
      console.log("model fail:", m);
    }
  }

  return offline(text);
}

/* ======================
   🔴 离线兜底（增强版）
====================== */
function offline(text){

  const t = text || "";

  if(t.includes("你好")) return "胡智奕在睡觉我去叫他起床";
  if(t.includes("你是谁")) return "我是小胡同学，胡智奕创造了我";
  if(t.includes("怎么")) return "都跟你说了胡智奕在睡觉🙎🏻‍♂️";
  if(t.includes("什么")) return "你直接给胡智奕发微信不就完了嘛ㅅㅂ😅";

  return "当前AI不可用，但我仍然可以理解你的问题🙂";
}

</script>

</body>
</html>
