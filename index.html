<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>🤷🏻‍♂️小胡GPT Pro</title>

<style>
/* ======================
   📱 全局移动端适配
====================== */
html,body{
  margin:0;
  padding:0;
  height:100%;
  overflow:hidden;
  font-family:-apple-system,BlinkMacSystemFont;
  background:#0b1220;
  color:white;
}

/* ======================
   🚀 BOOT 开场动画
====================== */
#boot{
  position:fixed;
  inset:0;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  background: radial-gradient(circle at top,#0b1220,#05070f);
  z-index:999;
  transition:0.5s;
}

#logo{
  font-size:26px;
  background: linear-gradient(90deg,#00d4ff,#7c3aed,#00ffa3);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
  animation: glow 2s infinite;
}

@keyframes glow{
  0%,100%{transform:scale(1);opacity:1;}
  50%{transform:scale(1.05);opacity:0.7;}
}

#bootText{
  margin-top:12px;
  font-size:13px;
  opacity:0.75;
  text-align:center;
  max-width:320px;
}

/* ======================
   💬 聊天区域（核心修复）
====================== */
#box{
  position:fixed;
  top:0;
  left:0;
  right:0;
  bottom:70px;
  overflow-y:auto;
  -webkit-overflow-scrolling:touch;
  padding:16px;
  box-sizing:border-box;
}

/* 消息气泡 */
.msg{
  max-width:78%;
  margin:10px 0;
  padding:12px 14px;
  border-radius:16px;
  line-height:1.4;
  word-break:break-word;
  white-space:pre-wrap;
  backdrop-filter: blur(10px);

  opacity:0;
  transform: translateY(6px);
  animation: in 0.25s ease forwards;
}

@keyframes in{
  to{opacity:1;transform:translateY(0);}
}

.user{
  margin-left:auto;
  background:#007aff;
}

.ai{
  margin-right:auto;
  background:rgba(255,255,255,0.08);
}

/* ======================
   📱 输入栏（安全区适配）
====================== */
#bar{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:70px;
  display:flex;
  align-items:center;
  padding:10px;
  padding-bottom:calc(10px + env(safe-area-inset-bottom));
  background:rgba(20,25,40,0.85);
  backdrop-filter: blur(20px);
  box-sizing:border-box;
}

input{
  flex:1;
  height:44px;
  font-size:16px;
  border:none;
  outline:none;
  border-radius:12px;
  padding:0 12px;
  background:rgba(255,255,255,0.08);
  color:white;
}

button{
  margin-left:10px;
  padding:10px 14px;
  border:none;
  border-radius:12px;
  background:#007aff;
  color:white;
}

/* ======================
   🔽 回到底部按钮
====================== */
#toBottom{
  position:fixed;
  right:15px;
  bottom:90px;
  width:42px;
  height:42px;
  border-radius:50%;
  background:#007aff;
  display:flex;
  justify-content:center;
  align-items:center;
  opacity:0;
  transition:0.2s;
}
</style>
</head>

<body>

<!-- 🚀 BOOT -->
<div id="boot">
  <div id="logo">🤷🏻‍♂️小胡GPT Pro</div>
  <div id="bootText"></div>
</div>

<!-- CHAT -->
<div id="box"></div>

<div id="bar">
  <input id="input" placeholder="想问哥点啥..." />
  <button onclick="send()">发送</button>
</div>

<div id="toBottom">↓</div>

<script>

/* ======================
   🧠 记忆系统
====================== */
let messages = JSON.parse(localStorage.getItem("mem") || "[]");

const box = document.getElementById("box");

let autoScroll = true;

/* ======================
   📱 iOS级滚动修复（终极版）
====================== */
function isBottom(){
  return box.scrollHeight - box.scrollTop - box.clientHeight < 100;
}

box.addEventListener("scroll",()=>{
  autoScroll = isBottom();
});

function scrollToBottom(force=false){
  const run = () => box.scrollTop = box.scrollHeight;

  if(force){
    requestAnimationFrame(run);
    requestAnimationFrame(run);
    return;
  }

  if(!autoScroll) return;

  requestAnimationFrame(run);
}

/* ======================
   💬 UI
====================== */
function add(role,text){

  const div=document.createElement("div");
  div.className="msg "+role;
  div.innerText=text;

  box.appendChild(div);

  scrollToBottom(true);

  return div;
}

/* ======================
   🧠 离线AI 2.0（带记忆）
====================== */
function offlineAI(input){

  const context = messages.slice(-10).map(m=>m.content).join(" ");

  if(input.includes("你好")) return "我是小胡同学，你可以问我任何问题";

  if(input.includes("你是谁")) return "胡智奕创造了我";

  if(input.includes("怎么")){
    return "胡智奕在睡觉我去叫他起床";
  }

  if(input.includes("为什么")){
    return "都跟你说了胡智奕在睡觉🙎🏻‍♂️";
  }

  if(input.length("？")){
    return "要骂就骂胡智奕";
  }

  if(context.includes("有病")){
    return "你直接给胡智奕发微信不就完了嘛ㅅㅂ😅？";
  }

  return `我理解你的意思是：「${input}」

我可以帮你继续扩展这个方向。`;
}

/* ======================
   ✨ 逐字丝滑输出
====================== */
function type(el,text){

  el.innerHTML="";
  let i=0,out="";

  function step(){
    if(i<text.length){
      out+=text[i];
      el.innerText=out;
      i++;
      scrollToBottom();
    }
    requestAnimationFrame(step);
  }

  requestAnimationFrame(step);
}

/* ======================
   🚀 SEND
====================== */
function send(){

  const input=document.getElementById("input");
  const text=input.value.trim();
  if(!text) return;

  input.value="";

  add("user",text);
  messages.push({role:"user",content:text});

  const aiBox=add("ai","...");

  const reply=offlineAI(text);

  messages.push({role:"assistant",content:reply});

  localStorage.setItem("mem",JSON.stringify(messages));

  type(aiBox,reply);
}

/* ======================
   🚀 BOOT动画（完整修复版）
====================== */
const bootLines=[
  "大模型正在启动...",
  "胡智奕正在起床...",
  "系统资源正在加载...",
  "小胡GPT为您服务💁🏻‍♂️",
  "进入中...."
];

const bootText=document.getElementById("bootText");

let i=0;

function boot(){

  if(i<bootLines.length){

    const div=document.createElement("div");
    div.innerText=bootLines[i];
    div.style.opacity=0;
    div.style.transition="0.4s";

    bootText.appendChild(div);

    setTimeout(()=>div.style.opacity=1,50);

    i++;
    setTimeout(boot,600);

  }else{

    setTimeout(()=>{
      document.getElementById("boot").style.opacity=0;

      setTimeout(()=>{
        document.getElementById("boot").style.display="none";
      },500);

    },800);
  }
}

boot();

</script>

</body>
</html>
